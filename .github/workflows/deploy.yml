name: CI/CD — Build Images (API + Frontend)

on:
  push:
    branches: [api-dash]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository }}/api
  IMAGE_FRONTEND: ghcr.io/${{ github.repository }}/frontend

concurrency:
  group: build-esoccer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Gerar tag do commit
        id: meta
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Login no ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers (API)
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache-api
          key: ${{ runner.os }}-buildx-api-${{ github.sha }}
          restore-keys: ${{ runner.os }}-buildx-api-

      - name: Build & Push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_API }}:${{ steps.meta.outputs.short_sha }}
            ${{ env.IMAGE_API }}:latest
          cache-from: type=local,src=/tmp/.buildx-cache-api
          cache-to: type=local,dest=/tmp/.buildx-cache-api-new,mode=max

      - name: Cache Docker layers (Frontend)
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache-frontend
          key: ${{ runner.os }}-buildx-frontend-${{ github.sha }}
          restore-keys: ${{ runner.os }}-buildx-frontend-

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./esoccerdashboard
          file: ./esoccerdashboard/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=https://api-tg-esoccer.arvsystems.cloud
          tags: |
            ${{ env.IMAGE_FRONTEND }}:${{ steps.meta.outputs.short_sha }}
            ${{ env.IMAGE_FRONTEND }}:latest
          cache-from: type=local,src=/tmp/.buildx-cache-frontend
          cache-to: type=local,dest=/tmp/.buildx-cache-frontend-new,mode=max

      - name: Mover caches
        run: |
          rm -rf /tmp/.buildx-cache-api /tmp/.buildx-cache-frontend
          mv /tmp/.buildx-cache-api-new /tmp/.buildx-cache-api
          mv /tmp/.buildx-cache-frontend-new /tmp/.buildx-cache-frontend

      - name: Resumo
        run: |
          echo "✅ Imagens publicadas:"
          echo "   API:      ${{ env.IMAGE_API }}:latest"
          echo "   Frontend: ${{ env.IMAGE_FRONTEND }}:latest"
          echo "   Tag:      ${{ steps.meta.outputs.short_sha }}"

  pull-vps:
    name: Pull images na VPS
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Pull via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            set -e

            echo "🔐 Login no registry..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            echo "📦 Pulling imagens..."
            docker pull "${{ env.IMAGE_API }}:latest"
            docker pull "${{ env.IMAGE_FRONTEND }}:latest"

            echo "🧹 Limpando imagens antigas..."
            docker image prune -f

            echo "✅ Imagens disponíveis na VPS. Crie/atualize a stack no Portainer."
