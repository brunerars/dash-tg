name: CI/CD — eSoccer Dashboard (API + Frontend)

on:
  push:
    branches: [api-dash]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository }}/api
  IMAGE_FRONTEND: ghcr.io/${{ github.repository }}/frontend

concurrency:
  group: deploy-esoccer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Gerar tag do commit
        id: meta
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Login no ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers (API)
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache-api
          key: ${{ runner.os }}-buildx-api-${{ github.sha }}
          restore-keys: ${{ runner.os }}-buildx-api-

      - name: Build & Push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_API }}:${{ steps.meta.outputs.short_sha }}
            ${{ env.IMAGE_API }}:latest
          cache-from: type=local,src=/tmp/.buildx-cache-api
          cache-to: type=local,dest=/tmp/.buildx-cache-api-new,mode=max

      - name: Cache Docker layers (Frontend)
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache-frontend
          key: ${{ runner.os }}-buildx-frontend-${{ github.sha }}
          restore-keys: ${{ runner.os }}-buildx-frontend-

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./esoccerdashboard
          file: ./esoccerdashboard/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=https://api-tg-esoccer.arvsystems.cloud
            VITE_API_KEY=${{ secrets.VITE_API_KEY }}
          tags: |
            ${{ env.IMAGE_FRONTEND }}:${{ steps.meta.outputs.short_sha }}
            ${{ env.IMAGE_FRONTEND }}:latest
          cache-from: type=local,src=/tmp/.buildx-cache-frontend
          cache-to: type=local,dest=/tmp/.buildx-cache-frontend-new,mode=max

      - name: Mover caches
        run: |
          rm -rf /tmp/.buildx-cache-api /tmp/.buildx-cache-frontend
          mv /tmp/.buildx-cache-api-new /tmp/.buildx-cache-api
          mv /tmp/.buildx-cache-frontend-new /tmp/.buildx-cache-frontend

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: read

    steps:
      - name: Validar secrets de deploy
        shell: bash
        run: |
          if [ -z "${{ secrets.VPS_HOST }}" ] || [ -z "${{ secrets.VPS_USER }}" ] || [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "Secrets de deploy ausentes (VPS_HOST, VPS_USER, VPS_SSH_KEY)"
            exit 1
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            set -e

            IMAGE_API="${{ env.IMAGE_API }}"
            IMAGE_FRONTEND="${{ env.IMAGE_FRONTEND }}"
            STACK="api-esoccer"

            echo "🔐 Login no registry..."
            echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            echo "📦 Pulling imagens..."
            docker pull "${IMAGE_API}:latest"
            docker pull "${IMAGE_FRONTEND}:latest"

            echo "📋 Serviços disponíveis na stack:"
            docker service ls --format '{{.Name}}' | grep "^${STACK}_" || echo "(nenhum)"

            # --- API ---
            if docker service inspect "${STACK}_api" >/dev/null 2>&1; then
              echo "🚀 Atualizando ${STACK}_api..."
              docker service update --image "${IMAGE_API}:latest" --with-registry-auth --force "${STACK}_api"
            else
              echo "⚠️  Serviço ${STACK}_api não encontrado."
            fi

            # --- Frontend ---
            if docker service inspect "${STACK}_frontend" >/dev/null 2>&1; then
              echo "🚀 Atualizando ${STACK}_frontend..."
              docker service update --image "${IMAGE_FRONTEND}:latest" --with-registry-auth --force "${STACK}_frontend"
            else
              echo "⚠️  Serviço ${STACK}_frontend não encontrado. Redeploy a stack no Portainer."
            fi

            echo "🧹 Limpando imagens antigas..."
            docker image prune -f

            echo "✅ Deploy concluído!"
